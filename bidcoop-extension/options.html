<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>BidCoop — Configuración</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 420px;
    margin: 24px;
    color: #0f172a;
  }
  h1 { font-size: 16px; margin-bottom: 4px; }
  p.hint { font-size: 12px; color: #64748b; margin-top: 0; }
  label { display: block; font-size: 12px; font-weight: 700; margin: 16px 0 4px; }
  input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 13px;
    box-sizing: border-box;
  }
  button {
    margin-top: 20px;
    padding: 8px 16px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  #status { margin-top: 12px; font-size: 12px; color: #16a34a; }
</style>
</head>
<body>
  <h1>BidCoop — Postulación Asistida</h1>
  <p class="hint">Estos datos quedan guardados solo en este navegador (chrome.storage.sync), nunca se comparten con nadie más que con tu propia instancia de BidCoop.</p>

  <label for="baseUrl">URL de BidCoop</label>
  <input id="baseUrl" type="url" placeholder="https://bidcoop.vercel.app" />

  <label for="token">Token (POSTULACION_API_TOKEN)</label>
  <input id="token" type="password" placeholder="El mismo valor que configuraste en Vercel" />

  <button id="save">Guardar</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
