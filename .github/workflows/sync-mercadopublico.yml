name: BidCoop — Sync Automático Mercado Público

# Único motor de datos del proyecto: scripts/sync_mercadopublico.py (BidCoop v7.6).
# Este workflow NO contiene lógica propia de sincronización — solo instala
# dependencias y ejecuta ese script, que es el mismo que se corre localmente.
# Nunca se debe reintroducir aquí un motor de datos paralelo (ver historial:
# una versión anterior de este archivo generaba montos/organismos inventados
# con random.randint cuando la API no traía el dato — no repetir ese patrón).

on:
  workflow_dispatch:   # Permite ejecutar manualmente desde GitHub cuando el usuario lo solicite
  schedule:
    # Cada 3 horas, 24/7 — no depende de que el usuario pida "actualiza".
    # Corre a las 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC,
    # que en horario estándar de Chile (UTC-4) equivale a 20:00, 23:00, 02:00,
    # 05:00, 08:00, 11:00, 14:00, 17:00. GitHub Actions solo agenda en UTC:
    # durante horario de verano chileno (UTC-3, aprox. septiembre-abril) cada
    # hora local corre ~1h más temprano.
    - cron: '0 */3 * * *'

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sincronizar con API Mercado Público (motor v7.6)
        env:
          MERCADOPUBLICO_TICKET: ${{ secrets.MERCADOPUBLICO_TICKET }}
          MERCADOPUBLICO_COMPRAAGIL_TICKET: ${{ secrets.MERCADOPUBLICO_COMPRAAGIL_TICKET }}
        run: python3 scripts/sync_mercadopublico.py

      - name: Commit y Push cambios
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "BidCoop Auto-Sync"
          git add src/app/mockData.ts data/sync_meta.json data/sync_diagnostics.json data/detail_cache.json data/mockData.ts.backup
          git diff --cached --quiet || git commit -m "sync: Auto $(date '+%Y-%m-%d %H:%M UTC') — API Mercado Público (BidCoop v7.6)"
          git push

      # El push a main dispara automáticamente el redeploy en Vercel vía la
      # integración GitHub ya configurada en el proyecto — no se necesita un
      # paso adicional aquí.
      #
      # Envío de correos: ESTRICTAMENTE MANUAL por instrucción explícita del
      # usuario. Este workflow nunca debe agregar un paso de envío de reportes
      # por correo.
